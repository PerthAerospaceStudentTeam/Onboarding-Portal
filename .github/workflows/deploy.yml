name: Deploy app changes

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Build and push backend image
        run: |
          az acr build --registry onboardingportalprodacr \
            --image backend:${{ github.sha }} \
            ./backend

      - name: Update Container App to new image
        run: |
          az containerapp update \
            --name onboarding-portal-prod-backend \
            --resource-group rg-onboarding-portal-prod \
            --image onboardingportalprodacr.azurecr.io/backend:${{ github.sha }} \
            --set-env-vars \
              SUPABASE_URL=secretref:supabase-url \
              SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-key \
              CORS_ORIGINS="https://purple-forest-0886ac500.7.azurestaticapps.net" \
            --secrets \
              supabase-url=${{ secrets.SUPABASE_URL }} \
              supabase-key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy-frontend:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /frontend
          output_location: dist
        env:
          VITE_API_URL: https://onboarding-portal-prod-backend.agreeablebeach-800d7c0b.eastasia.azurecontainerapps.io
